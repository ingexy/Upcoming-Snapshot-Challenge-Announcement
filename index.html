<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upcoming Snapshot Challenge Announcement</title>
<style>
:root{--bg:#f6f4f2;--panel:#fff;--ink:#1f1b1a;--mute:#6d6562;--line:#ddd6d2;--accent:#b3202a;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171414;--panel:#221e1d;--ink:#f0eae7;--mute:#a39a96;--line:#3a3431;--accent:#e0454f;--accent-ink:#171414}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;font:600 .85rem system-ui,sans-serif;margin:12px 0 4px}
label:first-child{margin-top:0}
input,textarea{width:100%;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font:.8rem system-ui,sans-serif;color:var(--mute);margin:4px 0 0}
.out{position:sticky;top:12px}
pre{white-space:pre-wrap;word-wrap:break-word;margin:0 0 12px;font:15px/1.5 system-ui,-apple-system,"Segoe UI Emoji",sans-serif;max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}
button{font:600 .95rem system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:8px}
.ok{margin-left:10px;font:.9rem system-ui,sans-serif;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Upcoming Snapshot Challenge Announcement</h1>
<p class="sub">Change the fields on the left, then copy the finished post from the right.</p>
<div class="grid">
<section class="panel" aria-label="Fields">
<label for="head">Header</label><input id="head" value="✨ UPCOMING SNAPSHOT CHALLENGE ✨">
<label for="title">Challenge title (add your own emoji)</label><input id="title" value="❤️ A SPLASH OF RED ❤️">
<label for="tag">Intro line</label><input id="tag" value="📸 A little splash of red can make a big impact!">
<label for="desc">Description</label>
<textarea id="desc" rows="9">Starting this Friday, we're exploring the striking beauty of the colour red, from bold and vibrant subjects to subtle touches of colour that catch the eye. Whether it's a single red flower, a colourful umbrella, a dramatic sunset or a tiny detail that stands out, start thinking about how red brings your photographs to life!

Whether red is the star of your photograph or just a little splash of colour in an otherwise neutral scene, get ready to share your creative interpretation of this week's theme.</textarea>
<div class="row">
<div><label for="start">Starts</label><input id="start" value="This Friday!"></div>
<div><label for="hash">Hashtag note</label><input id="hash" value="The official challenge hashtag will be announced when the challenge goes live"></div>
</div>
<div class="row">
<div><label for="date">End date</label><input id="date" type="date" value="2026-11-29"></div>
<div><label for="time">End time</label><input id="time" type="time" value="20:00"></div>
</div>
<label for="entry">Entry rule</label><input id="entry" value="📸 One entry per photographer. Both new and previously posted photographs will be welcome.">
<label for="close">Closing line</label><input id="close" value="📸 Start looking for that splash of red—we'll see you on Friday! ❤️">
<label for="tags">Hashtags</label>
<textarea id="tags" rows="2">#snap_challenge #photochallenge #challenge #verochallenge #vero #verofamily #photographerlife #fineartphotography</textarea>
</section>
<section class="panel out" aria-label="Result">
<pre id="out" aria-live="polite"></pre>
<button id="copy" type="button">Copy post</button><button id="reset" class="ghost" type="button">Reset</button><span class="ok" id="ok"></span>
</section>
</div>
</main>
<script>
(function(){
var SEP="・────•✧✼✧•────・";
var $=function(i){return document.getElementById(i)};
var ids=["head","title","tag","desc","start","hash","date","time","entry","close","tags"];
var defaults={};
ids.forEach(function(i){defaults[i]=$(i).value});
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function endDate(){
  var v=$("date").value; if(!v) return "";
  var p=v.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()];
}
function endTime(){
  var v=$("time").value; if(!v) return "";
  var p=v.split(":"), h=+p[0], ap=h>=12?"PM":"AM";
  h=h%12; if(h===0) h=12;
  return h+":"+p[1]+" "+ap;
}
function build(){
  var starts="⏳ STARTS: "+$("start").value.trim();
  if($("hash").value.trim()) starts+=" ("+$("hash").value.trim()+")";
  var ends="🔴 ENDS: "+endDate()+" – "+endTime();
  var parts=[
    $("head").value.trim(),$("title").value.trim(),SEP,
    $("tag").value.trim(),$("desc").value.trim(),SEP,
    "📋 CHALLENGE DETAILS",starts,ends,$("entry").value.trim(),SEP,
    $("close").value.trim(),SEP,
    $("tags").value.trim(),"."
  ].filter(function(s){return s!==""});
  return parts.join("\n\n");
}
function render(){ $("out").textContent=build(); }
ids.forEach(function(i){$(i).addEventListener("input",render)});
$("copy").addEventListener("click",function(){
  var t=build(), ok=$("ok");
  function done(m){ok.textContent=m;setTimeout(function(){ok.textContent=""},2200)}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done("Copied")}catch(e){done("Select the text and copy it manually")}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done("Copied")},fallback)}else{fallback()}
});
$("reset").addEventListener("click",function(){ids.forEach(function(i){$(i).value=defaults[i]});render()});
render();
})();
</script>
</body>
</html>
